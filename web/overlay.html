<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prolink Listener — OBS Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --text:#f4f6fb;
  --dim:rgba(244,246,251,.72);
  --dimmest:rgba(244,246,251,.42);
  --line:rgba(255,255,255,.14);
  --panel:rgba(8,10,14,.78);
  --accent:#22d3ee;
  --d1:#ffb020;
  --d2:#22d3ee;
  --d3:#f472b6;
  --d4:#4ade80;
  --mono:'Chakra Petch',Consolas,monospace;
  --sans:'Archivo','Segoe UI',sans-serif;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:transparent !important;
  overflow:hidden;
  font-family:var(--sans);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
body.preview{
  background:radial-gradient(circle at 20% 10%,#1a2230,#07080a 55%) !important;
}
#root{
  width:100%;height:100%;
  display:flex;align-items:flex-end;justify-content:flex-start;
  padding:3vh 2vw;
}
#root.corner-tr{align-items:flex-start;justify-content:flex-end}
#root.corner-tl{align-items:flex-start;justify-content:flex-start}
#root.corner-br{align-items:flex-end;justify-content:flex-end}
#root.corner-bl{align-items:flex-end;justify-content:flex-start}
#root.center{align-items:center;justify-content:center}
#root.spread{justify-content:stretch;align-items:flex-start}
#root.spread.corner-bl,#root.spread.corner-br{align-items:flex-end}
#root.spread.corner-center{align-items:center}

.card{
  display:none;
  min-width:min(520px,92vw);
  max-width:min(760px,96vw);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  overflow:hidden;
  opacity:0;
  transform:translateY(12px);
  transition:opacity .35s ease, transform .35s ease;
}
.card.show{display:block;opacity:1;transform:none}
.card.hide{opacity:0;transform:translateY(12px)}
.card.spread{
  width:100%;
  max-width:none;
  min-width:0;
}

.now{
  display:grid;
  grid-template-columns:108px 1fr;
  gap:16px;
  padding:16px 18px;
  align-items:center;
}
.now .art{
  width:108px;height:108px;border-radius:12px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  object-fit:cover;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:34px;color:var(--dimmest);
}
.now .art img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.meta{min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;
  border:1px solid currentColor;color:var(--accent);
}
.tag.deck{color:var(--deck,#22d3ee)}
.tag.master{color:#ffd45e}
.tag.sync{color:var(--dim)}
.tag.onair{color:#ff6b61;background:rgba(255,107,97,.12)}
.tag.loop{color:#2ee89a;background:rgba(46,232,154,.12);display:inline-flex;align-items:center;gap:4px}
.tag.loop svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.title{
  font-size:clamp(20px,2.4vw,28px);font-weight:700;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.artist{
  margin-top:4px;font-size:clamp(14px,1.5vw,17px);color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.readouts{
  margin-top:12px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}
.bpm{font-size:22px;font-weight:700}
.bpm small{font-size:11px;letter-spacing:.12em;color:var(--dimmest);margin-left:4px}
.key{font-size:15px;font-weight:700;color:var(--deck,#22d3ee)}
.time{font-size:13px;color:var(--dim)}
.time .remain{color:var(--dimmest)}
.time .remain.low{color:#ff6b61}
.progress{
  margin-top:10px;height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;
}
.progress > i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--deck,#22d3ee),#fff);
  transition:width .08s linear;
}
.wave{
  margin-top:10px;height:36px;width:100%;
  border-radius:6px;background:rgba(0,0,0,.35);
  border:1px solid var(--line);overflow:hidden;
}
.wave canvas{display:block;width:100%;height:100%}

.dual{
  display:grid;gap:12px;padding:14px;
  width:100%;
  max-width:none;
  min-width:0;
}
.dual.decks-2{grid-template-columns:1fr 1fr}
.dual.decks-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dual .slot{
  display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;
  padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.22);
  min-width:0;
}
.dual .art{
  width:64px;height:64px;font-size:22px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--dimmest);
  font-family:var(--mono);overflow:hidden;
}
.dual .art img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.dual .title{font-size:15px}
.dual .artist{font-size:12px}
.dual .bpm{font-size:16px}
.dual .readouts{margin-top:8px;gap:10px}
.dual .progress{margin-top:8px}
.dual .wave{height:28px;margin-top:8px}

.minimal{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px 10px 10px;
  min-width:0;
}
.minimal .art{width:54px;height:54px;border-radius:10px;font-size:20px}
.minimal .art img{border-radius:10px}
.minimal .title{font-size:16px}
.minimal .artist{font-size:12px;margin-top:2px}
.minimal .bpm{margin-left:auto;font-family:var(--mono);font-size:18px;font-weight:700;white-space:nowrap}

#idle{
  display:none;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dimmest);padding:10px 14px;border:1px dashed var(--line);border-radius:10px;
  background:rgba(0,0,0,.25);
}
#idle.show{display:inline-block}

@media (max-width:1100px){
  .dual.decks-4{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .dual.decks-2,.dual.decks-4{grid-template-columns:1fr}
  .now{grid-template-columns:84px 1fr}
  .now .art{width:84px;height:84px}
}
</style>
</head>
<body>
<div id="root">
  <div id="idle">waiting for player</div>
  <div id="card" class="card"></div>
</div>

<script>
const DECK_COLORS = {1:'#ffb020',2:'#22d3ee',3:'#f472b6',4:'#4ade80',5:'#ffb020',6:'#22d3ee'};
const params = new URLSearchParams(location.search);
const layout = ['nowplaying','dual','minimal'].includes(params.get('layout'))
  ? params.get('layout') : 'nowplaying';
const corner = ['bl','br','tl','tr','center'].includes(params.get('corner'))
  ? params.get('corner') : 'bl';
const onlyPlaying = params.get('playing') !== '0';
const preview = params.get('preview') === '1';
const useMix = params.get('mix') !== '0';
const maxDecks = Math.min(4, Math.max(1, +(params.get('decks') || (layout === 'dual' ? 2 : 1))));
const WAVE_STYLES = ['rgb', '3band', 'blue'];
const waveStyle = WAVE_STYLES.includes(params.get('wave')) ? params.get('wave') : 'rgb';
const spread = layout === 'dual';

if (preview) document.body.classList.add('preview');
const root = document.getElementById('root');
root.classList.add('corner-' + corner);
if (spread) root.classList.add('spread');

const tracks = new Map();   // id -> {meta, overview}
const pending = new Set();
let last = null;
let receivedAt = 0;

function mmss(ms){
  ms = Math.max(0, ms|0);
  const t = Math.floor(ms/1000);
  return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

function remainHtml(pos, dur){
  if (!dur) return '';
  const rem = Math.max(0, dur - pos);
  const low = rem < 30000 ? ' low' : '';
  return `<span class="remain${low}">-${mmss(rem)}</span>`;
}

function timeHtml(pos, dur){
  if (!dur) return mmss(pos);
  return `${mmss(pos)} / ${remainHtml(pos, dur)}`;
}

function overlayDuration(deck, pack){
  const deckDur = +(deck && deck.duration_ms || 0);
  const metaDur = +(pack && pack.meta && pack.meta.duration_ms || 0);
  const sane = d => d > 1000 && d < 12 * 3600 * 1000;
  if (sane(deckDur) && sane(metaDur)) {
    if (deckDur > metaDur * 2) return metaDur;
    if (metaDur > deckDur * 2) return deckDur;
    return Math.max(deckDur, metaDur);
  }
  if (sane(metaDur)) return metaDur;
  if (sane(deckDur)) return deckDur;
  return metaDur || deckDur || 0;
}

const DECK_LAYOUT = {2: [1, 2], 4: [3, 1, 2, 4]};

function visibleDecks(list){
  const byNum = new Map((list || []).map(d => [d.number, d]));
  const layoutN = maxDecks >= 4 ? 4 : 2;
  const order = DECK_LAYOUT[layoutN] || DECK_LAYOUT[2];
  let rows = [];
  for (const n of order) {
    const d = byNum.get(n);
    if (d) rows.push(d);
  }
  if (onlyPlaying) rows = rows.filter(d => d.playing || d.track_id);
  return rows.slice(0, maxDecks);
}

function pickDecks(state){
  const list = state.decks || [];
  if (layout === 'dual' || !useMix) return visibleDecks(list);
  const np = state.now_playing;
  if (np && np.number) {
    const live = list.find(d => d.number === np.number);
    const deck = live ? Object.assign({}, np, live) : np;
    if (deck.track_id || deck.playing) return [deck];
  }
  return visibleDecks(list);
}

function readWaveform(buf, off){
  const dv = new DataView(buf);
  const n = dv.getUint32(off + 8, true);
  const cps = dv.getFloat32(off + 12, true);
  const dur = dv.getUint32(off + 16, true);
  const h = new Uint8Array(buf, off + 24, n);
  const rgb = new Uint8Array(buf, off + 24 + n, n * 3);
  return {n, cps, dur, h, rgb, end: off + 24 + n * 4};
}

function readBands(buf, off){
  if (!buf || off + 24 > buf.byteLength) return null;
  const dv = new DataView(buf);
  const magic = String.fromCharCode(dv.getUint8(off), dv.getUint8(off+1),
    dv.getUint8(off+2), dv.getUint8(off+3));
  if (magic !== 'PLWB') return null;
  const n = dv.getUint32(off + 8, true);
  const end = off + 24 + n * 3;
  if (end > buf.byteLength) return null;
  return {
    n,
    low: new Uint8Array(buf, off + 24, n),
    mid: new Uint8Array(buf, off + 24 + n, n),
    high: new Uint8Array(buf, off + 24 + 2 * n, n),
    end,
  };
}

function readBlue(buf, off){
  if (!buf || off + 24 > buf.byteLength) return null;
  const dv = new DataView(buf);
  const magic = String.fromCharCode(dv.getUint8(off), dv.getUint8(off+1),
    dv.getUint8(off+2), dv.getUint8(off+3));
  if (magic !== 'PLBC') return null;
  const n = dv.getUint32(off + 8, true);
  const end = off + 24 + n * 4;
  if (end > buf.byteLength) return null;
  return {
    n,
    h: new Uint8Array(buf, off + 24, n),
    rgb: new Uint8Array(buf, off + 24 + n, n * 3),
    end,
  };
}

function attachBands(wave, bands){
  if (!wave || !bands || bands.n !== wave.n) return;
  wave.low = bands.low; wave.mid = bands.mid; wave.high = bands.high;
  let peak = 1;
  for (let i = 0; i < bands.n; i++) {
    peak = Math.max(peak, bands.low[i], bands.mid[i], bands.high[i]);
  }
  wave.bandPeak = peak;
}

function attachBlue(wave, blue){
  if (!wave || !blue || blue.n !== wave.n) return;
  wave.blueH = blue.h; wave.blueRgb = blue.rgb;
}

async function loadTrack(id){
  if (!id || tracks.has(id) || pending.has(id)) return;
  pending.add(id);
  try{
    const [meta, buf] = await Promise.all([
      fetch(`/api/track/${id}`).then(r => r.ok ? r.json() : null),
      fetch(`/api/waveform/${id}`).then(r => r.ok ? r.arrayBuffer() : null),
    ]);
    if (!meta) return;
    let overview = null;
    if (buf) {
      const detail = readWaveform(buf, 0);
      overview = readWaveform(buf, detail.end);
      const b1 = readBands(buf, overview.end);
      const b2 = b1 ? readBands(buf, b1.end) : null;
      attachBands(overview, b2);
      const blue1 = readBlue(buf, b2 ? b2.end : (b1 ? b1.end : overview.end));
      if (blue1) attachBlue(overview, readBlue(buf, blue1.end));
    }
    tracks.set(id, {meta, overview});
  } finally { pending.delete(id); }
}

function artHtml(trackId, pack){
  const meta = pack && pack.meta;
  if (trackId && meta && meta.has_artwork)
    return `<div class="art"><img alt="" src="/api/artwork/${trackId}"></div>`;
  return `<div class="art">♪</div>`;
}

function loopBeats(loop, bpm) {
  if (!loop || !bpm || bpm <= 0) return 0;
  const ms = Math.max(0, (loop.end || 0) - (loop.t || 0));
  return Math.max(0, Math.round(ms / (60000 / bpm)));
}

function activeLoop(meta, pos, looping) {
  if (!meta || !meta.cues) return null;
  const loops = meta.cues.filter(c => c.type === 'loop' && c.end > c.t);
  if (!loops.length) return null;
  const inside = loops.find(c => pos >= c.t && pos <= c.end);
  if (inside) return inside;
  return looping ? loops[0] : null;
}

const LOOP_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
  <path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
</svg>`;

function tagsHtml(deck, pack, pos){
  const bits = [`<span class="tag deck">DECK ${deck.number}</span>`];
  if (deck.master) bits.push('<span class="tag master">MASTER</span>');
  if (deck.sync) bits.push('<span class="tag sync">SYNC</span>');
  if (deck.on_air) bits.push('<span class="tag onair">ON AIR</span>');
  const looping = deck.state === 'looping';
  if (looping) {
    const loop = activeLoop(pack && pack.meta, pos || 0, true);
    const beats = loopBeats(loop, deck.track_bpm || deck.bpm);
    const label = beats ? String(beats) : 'LOOP';
    bits.push(`<span class="tag loop" title="Loop">${LOOP_ICON}${label}</span>`);
  }
  return `<div class="tags">${bits.join('')}</div>`;
}

function progressPct(pos, dur){
  if (!dur) return 0;
  return Math.max(0, Math.min(100, (pos/dur)*100));
}

function waveHtml(trackId){
  return `<div class="wave"><canvas data-wave="${trackId||0}"></canvas></div>`;
}

function paintWaveCanvas(cv, pack, pos, color, looping){
  if (!cv) return;
  const r = window.devicePixelRatio || 1;
  const cssW = Math.max(1, Math.round(cv.clientWidth || cv.parentElement.clientWidth || 120));
  const cssH = Math.max(1, Math.round(cv.clientHeight || 28));
  const W = Math.round(cssW * r), H = Math.round(cssH * r);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect(0, 0, W, H);
  const ov = pack && pack.overview;
  if (!ov || !ov.n) return;
  const mid = H / 2, span = mid * 0.9;
  const colW = Math.max(1, Math.round(r));
  for (let x = 0; x < cssW; x++) {
    const i = Math.min(ov.n - 1, Math.floor(x * ov.n / cssW));
    const amp = (ov.h[i] / 31) * span;
    fillOverlayColumn(ctx, Math.round(x * r), mid, amp, i, ov, span, colW);
  }
  const dur = (pack.meta && pack.meta.duration_ms) || ov.dur || 1;
  const px = Math.max(0, Math.min(W, (pos / dur) * W));
  if (looping && pack.meta && pack.meta.cues) {
    const loop = pack.meta.cues.find(c => c.type === 'loop' && c.end > c.t && pos >= c.t && pos <= c.end)
      || pack.meta.cues.find(c => c.type === 'loop' && c.end > c.t);
    if (loop) {
      const x0 = (loop.t / dur) * W, x1 = (loop.end / dur) * W;
      ctx.fillStyle = 'rgba(46,232,154,.30)';
      ctx.fillRect(x0, 0, Math.max(1, x1 - x0), H);
    }
  }
  // Cue markers on the overlay mini-wave.
  if (pack.meta && pack.meta.cues) {
    for (const c of pack.meta.cues) {
      if (c.type === 'loop') continue;
      const cx = (c.t / dur) * W;
      ctx.fillStyle = c.color ? `rgb(${c.color[0]},${c.color[1]},${c.color[2]})`
                              : (c.hot ? '#ffd45e' : '#ffffff');
      ctx.fillRect(cx - r, 0, Math.max(2, Math.round(2 * r)), H);
      if (c.hot) {
        const bw = 10 * r, bh = 8 * r;
        ctx.fillRect(cx - bw / 2, 0, bw, bh);
        ctx.fillStyle = '#000';
        ctx.font = `700 ${7 * r}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(String.fromCharCode(64 + c.hot), cx, 6.5 * r);
      }
    }
  }
  ctx.fillStyle = 'rgba(8,10,12,.55)';
  ctx.fillRect(px, 0, W - px, H);
  ctx.fillStyle = color || '#22d3ee';
  ctx.fillRect(px - r, 0, Math.max(2, Math.round(2 * r)), H);
}

function fillMirrored(ctx, x, mid, amp, colW){
  if (amp < 0.5) return;
  ctx.fillRect(x, Math.round(mid - amp), colW, Math.max(1, Math.round(amp * 2)));
}

function fillOverlayColumn(ctx, x, mid, amp, src, wave, span, colW){
  if (waveStyle === '3band') {
    const low = wave.low && wave.low[src];
    const md = wave.mid && wave.mid[src];
    const hi = wave.high && wave.high[src];
    const peak = wave.bandPeak || 31;
    if (peak >= 2 && (low || md || hi)) {
      const lowPx = (low || 0) / peak * span;
      const midPx = (md || 0) / peak * span;
      const highPx = (hi || 0) / peak * span;
      if (lowPx > midPx) {
        ctx.fillStyle = 'rgb(32,83,217)'; fillMirrored(ctx, x, mid, lowPx, colW);
        ctx.fillStyle = 'rgb(169,107,39)'; fillMirrored(ctx, x, mid, midPx, colW);
      } else {
        if (Math.abs(lowPx - midPx) >= 0.4) {
          ctx.fillStyle = 'rgb(242,170,60)'; fillMirrored(ctx, x, mid, midPx, colW);
        }
        ctx.fillStyle = 'rgb(169,107,39)'; fillMirrored(ctx, x, mid, lowPx, colW);
      }
      ctx.fillStyle = 'rgb(255,255,255)'; fillMirrored(ctx, x, mid, highPx, colW);
      return;
    }
  }
  let drawAmp = amp;
  if (waveStyle === 'blue') {
    if (wave.blueH && wave.blueH.length === wave.n) drawAmp = (wave.blueH[src] / 31) * span;
    if (wave.blueRgb && wave.blueRgb.length === wave.n * 3) {
      const b = wave.blueRgb;
      ctx.fillStyle = `rgb(${b[src * 3]},${b[src * 3 + 1]},${b[src * 3 + 2]})`;
    } else ctx.fillStyle = 'rgb(0,168,232)';
  } else {
    const rgb = wave.rgb;
    ctx.fillStyle = `rgb(${rgb[src * 3]},${rgb[src * 3 + 1]},${rgb[src * 3 + 2]})`;
  }
  fillMirrored(ctx, x, mid, drawAmp, colW);
}

function renderNow(deck, pos){
  const pack = tracks.get(deck.track_id);
  const meta = pack && pack.meta;
  const title = meta ? (meta.title || '—') : (deck.track_id ? 'loading…' : 'no track');
  const artist = meta ? (meta.artist || '') : '';
  const key = meta ? (meta.key || '') : '';
  const color = DECK_COLORS[deck.number] || '#22d3ee';
  return `
    <div class="now" style="--deck:${color}">
      ${artHtml(deck.track_id, pack)}
      <div class="meta">
        ${tagsHtml(deck, pack, pos)}
        <div class="title">${escapeHtml(title)}</div>
        <div class="artist">${escapeHtml(artist)}</div>
        <div class="readouts">
          <div class="bpm">${deck.bpm ? deck.bpm.toFixed(2) : '—'}<small>BPM</small></div>
          ${key ? `<div class="key">${escapeHtml(key)}</div>` : ''}
          <div class="time" data-time>${timeHtml(pos, overlayDuration(deck, pack))}</div>
        </div>
        ${waveHtml(deck.track_id)}
        <div class="progress"><i style="width:${progressPct(pos, overlayDuration(deck, pack))}%"></i></div>
      </div>
    </div>`;
}

function renderMinimal(deck, pos){
  const pack = tracks.get(deck.track_id);
  const meta = pack && pack.meta;
  const title = meta ? (meta.title || '—') : (deck.track_id ? 'loading…' : 'no track');
  const artist = meta ? (meta.artist || '') : '';
  const color = DECK_COLORS[deck.number] || '#22d3ee';
  return `
    <div class="minimal" style="--deck:${color}">
      ${artHtml(deck.track_id, pack)}
      <div class="meta" style="min-width:0">
        <div class="title">${escapeHtml(title)}</div>
        <div class="artist">${escapeHtml(artist)}</div>
      </div>
      <div class="bpm" style="color:${color}">${deck.bpm ? deck.bpm.toFixed(1) : '—'}</div>
    </div>`;
}

function renderDual(decks, positions){
  const cols = maxDecks >= 4 ? 4 : 2;
  return `<div class="dual decks-${cols}">${decks.map((d,i)=>{
    const pack = tracks.get(d.track_id);
    const meta = pack && pack.meta;
    const title = meta ? (meta.title || '—') : (d.track_id ? 'loading…' : 'no track');
    const artist = meta ? (meta.artist || '') : '';
    return `
    <div class="slot" style="--deck:${DECK_COLORS[d.number]||'#22d3ee'}">
      ${artHtml(d.track_id, pack)}
      <div class="meta">
        ${tagsHtml(d, pack, positions[i])}
        <div class="title">${escapeHtml(title)}</div>
        <div class="artist">${escapeHtml(artist)}</div>
        <div class="readouts">
          <div class="bpm">${d.bpm?d.bpm.toFixed(2):'—'}<small>BPM</small></div>
          <div class="time" data-time>${timeHtml(positions[i], overlayDuration(d, pack))}</div>
        </div>
        ${waveHtml(d.track_id)}
        <div class="progress"><i style="width:${progressPct(positions[i], overlayDuration(d, pack))}%"></i></div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function paintWaves(decks, positions){
  const card = document.getElementById('card');
  card.querySelectorAll('canvas[data-wave]').forEach((cv, i) => {
    const d = decks[i] || decks[0];
    if (!d) return;
    paintWaveCanvas(
      cv,
      tracks.get(d.track_id),
      positions[i] ?? positions[0],
      DECK_COLORS[d.number],
      d.state === 'looping'
    );
  });
}

function paint(){
  const card = document.getElementById('card');
  const idle = document.getElementById('idle');
  if (!last){
    card.classList.remove('show');
    idle.classList.add('show');
    return;
  }
  const dt = (performance.now() - receivedAt) / 1000;
  const decks = pickDecks(last);
  if (!decks.length || !decks.some(d => d.track_id)){
    card.classList.remove('show');
    idle.classList.add('show');
    return;
  }
  idle.classList.remove('show');
  const positions = decks.map(d => {
    const pack = tracks.get(d.track_id);
    const dur = overlayDuration(d, pack);
    let pos = +(d.position_ms||0) + (d.playing ? dt*1000*(d.speed||1) : 0);
    if (dur) pos = Math.min(pos, dur);
    return pos;
  });
  for (const d of decks) if (d.track_id) loadTrack(d.track_id);

  let html = '';
  if (layout === 'dual') html = renderDual(decks, positions);
  else if (layout === 'minimal') html = renderMinimal(decks[0], positions[0]);
  else html = renderNow(decks[0], positions[0]);

  const np = last.now_playing;
  const mixSig = useMix && np ? `:mix${np.number}:${np.track_id||0}` : '';
  const waveSig = decks.map(d => {
    const p = tracks.get(d.track_id);
    return `${d.number}:${d.track_id||0}:${!!(p&&p.meta)}:${!!(p&&p.overview)}:${d.state||''}`;
  }).join('|');
  const sig = waveSig + '|' + layout + mixSig + `|d${maxDecks}`;
  card.classList.toggle('spread', spread);
  if (card.dataset.sig !== sig){
    card.innerHTML = html;
    card.dataset.sig = sig;
  } else {
    card.querySelectorAll('.progress > i').forEach((el,i)=>{
      const d = decks[i] || decks[0];
      const pack = tracks.get(d.track_id);
      el.style.width = progressPct(positions[i] ?? positions[0], overlayDuration(d, pack)) + '%';
    });
    card.querySelectorAll('[data-time]').forEach((el,i)=>{
      const d = decks[i] || decks[0];
      const pack = tracks.get(d.track_id);
      const pos = positions[i] ?? positions[0];
      el.innerHTML = timeHtml(pos, overlayDuration(d, pack));
    });
    card.querySelectorAll('.bpm').forEach((el,i)=>{
      const d = decks[Math.min(i, decks.length-1)];
      if (!d) return;
      if (layout === 'minimal')
        el.textContent = d.bpm ? d.bpm.toFixed(1) : '—';
      else
        el.innerHTML = `${d.bpm ? d.bpm.toFixed(2) : '—'}<small>BPM</small>`;
    });
  }
  paintWaves(decks, positions);
  card.classList.add('show');
}

function applyState(state){
  last = state;
  receivedAt = performance.now();
}

function connect(){
  const es = new EventSource('/api/events');
  es.onmessage = ev => applyState(JSON.parse(ev.data));
  es.onerror = () => {
    es.close();
    setTimeout(connect, 1500);
  };
}

function loop(){
  requestAnimationFrame(loop);
  paint();
}

connect();
loop();
</script>
</body>
</html>
