<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prolink Listener — OBS Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<script src="wavepack.js"></script>
<script src="spectrum.js"></script>
<style>
:root{
  --text:#f4f6fb;
  --dim:rgba(244,246,251,.72);
  --dimmest:rgba(244,246,251,.42);
  --line:rgba(255,255,255,.14);
  --panel:rgba(8,10,14,.78);
  --accent:#22d3ee;
  --scale:1;
  --d1:#ffb020;
  --d2:#22d3ee;
  --d3:#f472b6;
  --d4:#4ade80;
  --mono:'Chakra Petch',Consolas,monospace;
  --sans:'Archivo','Segoe UI',sans-serif;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:transparent !important;
  overflow:hidden;
  font-family:var(--sans);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
body.embed{background:transparent !important}
body.preview{
  background:radial-gradient(circle at 20% 10%,#1a2230,#07080a 55%) !important;
}
#root.embed-mode{
  padding:0;
  height:100%;
  box-sizing:border-box;
}
#root.embed-mode.now-card-mode{
  padding:14px;
}
#root.embed-mode.now-card-mode.corner-bl{align-items:flex-end;justify-content:flex-start}
#root.embed-mode.now-card-mode.corner-br{align-items:flex-end;justify-content:flex-end}
#root.embed-mode.now-card-mode.corner-tl{align-items:flex-start;justify-content:flex-start}
#root.embed-mode.now-card-mode.corner-tr{align-items:flex-start;justify-content:flex-end}
#root.embed-mode.now-panel-mode{
  align-items:stretch;
  justify-content:stretch;
}
#root.embed-mode #stack{
  width:100%;
  height:auto;
  max-width:none;
  align-items:stretch;
  flex:0 0 auto;
}
#root.embed-mode #next{display:none !important}
#root.embed-mode .card{
  width:100%;
  height:auto;
  max-width:100%;
  max-height:100%;
  min-width:0;
  flex:0 1 auto;
  display:block;
  border-radius:calc(16px * var(--scale));
  box-sizing:border-box;
}
#root.embed-mode.now-panel-mode .card{border-radius:calc(10px * var(--scale))}
#root.embed-mode.now-panel-mode #stack{height:100%;flex:1}
#root.embed-mode.now-panel-mode .card{
  height:100%;
  display:flex;
  flex-direction:column;
  flex:1;
}
#root.embed-mode .card.show{transform:none}
#root.embed-mode.now-card-mode #stack{
  max-height:100%;
  min-height:0;
  height:100%;
  justify-content:center;
}
#root.embed-mode .now-card{
  flex:0 1 auto;
  justify-content:flex-start;
  max-width:100%;
  max-height:100%;
  min-width:0;
  min-height:0;
  width:100%;
  box-sizing:border-box;
}
#root.embed-mode .now-card .art{
  flex:1 1 auto;
  min-height:0;
  width:min(calc(500px * var(--scale)),100%);
  max-height:min(calc(500px * var(--scale)),100%);
  height:auto;
}
#root.embed-mode .now-card .meta{flex:0 0 auto}
#root.embed-mode .now-card .wave{width:100%;max-width:100%;flex:0 0 auto}
#root.embed-mode .now-panel{flex:1;min-height:0}
#root.embed-mode .panel-detail{
  flex:1 0 calc(72px * var(--scale));
  min-height:calc(72px * var(--scale));
  height:calc(96px * var(--scale));
}
body.float-window .card{-webkit-app-region:drag}
body.float-window canvas{-webkit-app-region:no-drag}
#root{
  width:100%;height:100%;
  display:flex;align-items:flex-end;justify-content:flex-start;
  padding:3vh 2vw;
  font-size:calc(16px * var(--scale));
}
#root.corner-tr{align-items:flex-start;justify-content:flex-end}
#root.corner-tl{align-items:flex-start;justify-content:flex-start}
#root.corner-br{align-items:flex-end;justify-content:flex-end}
#root.corner-bl{align-items:flex-end;justify-content:flex-start}
#root.center{align-items:center;justify-content:center}
#root.spread{justify-content:stretch;align-items:flex-start}
#root.spread.corner-bl,#root.spread.corner-br{align-items:flex-end}
#root.spread.corner-center{align-items:center}
#stack{display:flex;flex-direction:column;gap:0;align-items:stretch;max-width:100%}
#root.corner-br #stack,#root.corner-tr #stack{align-items:flex-end}
#root.center #stack{align-items:center}

.card{
  display:none;
  min-width:min(calc(520px * var(--scale)),92vw);
  max-width:min(calc(760px * var(--scale)),96vw);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:calc(16px * var(--scale));
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  overflow:hidden;
  opacity:0;
  transform:translateY(12px) scale(var(--scale));
  transform-origin:inherit;
  transition:opacity .35s ease, transform .35s ease;
}
#root.corner-bl .card,#root.corner-br .card{transform-origin:bottom left}
#root.corner-br .card{transform-origin:bottom right}
#root.corner-tl .card{transform-origin:top left}
#root.corner-tr .card{transform-origin:top right}
#root.center .card{transform-origin:center}
.card.show{display:block;opacity:1;transform:scale(var(--scale))}
.card.hide{opacity:0;transform:translateY(12px) scale(var(--scale))}
.card.spread{
  width:100%;
  max-width:none;
  min-width:0;
}

.now-card{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:calc(20px * var(--scale)) calc(24px * var(--scale)) calc(18px * var(--scale));
  min-width:min(calc(560px * var(--scale)),96vw);
  max-width:min(calc(620px * var(--scale)),96vw);
  flex:0 0 auto;
}
.now-card .art{
  width:min(calc(500px * var(--scale)),100%);
  aspect-ratio:1;
  height:auto;
  border-radius:calc(20px * var(--scale));
  margin:0 auto calc(12px * var(--scale));
  font-size:calc(96px * var(--scale));
  flex-shrink:0;
  overflow:hidden;
}
.now-card .art img,.now-panel .art img{
  width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;
}
.now-card .meta{width:100%;min-width:0;flex:0 0 auto}
.now-card .tags{justify-content:center;margin-bottom:calc(8px * var(--scale))}
.now-card .title{
  font-size:clamp(calc(28px * var(--scale)),3.4vw,calc(44px * var(--scale)));
  white-space:normal;line-height:1.12;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.now-card .artist{
  margin-top:calc(6px * var(--scale));
  font-size:clamp(calc(16px * var(--scale)),1.8vw,calc(22px * var(--scale)));
}
.now-card .readouts{justify-content:center;margin-top:calc(10px * var(--scale));gap:18px}
.now-card .bpm{font-size:calc(26px * var(--scale))}
.now-card .key{font-size:calc(17px * var(--scale))}
.now-card .progress{margin-top:calc(10px * var(--scale));height:5px;max-width:min(520px,92%)}
.now-card .wave{
  margin-top:calc(8px * var(--scale));
  height:calc(44px * var(--scale));
  width:100%;
  max-width:100%;
  flex:0 0 auto;
}

#root.now-panel-mode{padding:0;align-items:stretch;justify-content:stretch}
#root.now-panel-bottom{align-items:flex-end}
#root.now-panel-top{align-items:flex-start}
#root.now-panel-mode #stack{width:100%;max-width:100%;align-items:stretch}
#root.now-panel-mode .card{
  min-width:0;max-width:none;width:100%;border-radius:0;border-left:none;border-right:none;
  box-shadow:0 -8px 40px rgba(0,0,0,.35);
}
#root.now-panel-top .card{box-shadow:0 8px 40px rgba(0,0,0,.35)}
.now-panel{
  width:100%;padding:calc(14px * var(--scale)) calc(22px * var(--scale));
  display:flex;flex-direction:column;gap:calc(10px * var(--scale));
}
.now-panel .panel-info{
  display:flex;align-items:center;gap:calc(16px * var(--scale));min-width:0;
}
.now-panel .panel-info .art{
  width:calc(48px * var(--scale));height:calc(48px * var(--scale));flex-shrink:0;
  border-radius:calc(8px * var(--scale));font-size:calc(20px * var(--scale));
}
.now-panel .panel-spectrum{
  width:100%;height:calc(72px * var(--scale));display:block;flex:0 0 auto;
  border-radius:calc(6px * var(--scale));
  background:rgba(0,0,0,.42);
}
.now-panel .panel-info .copy{min-width:0;text-align:left;flex:1}
.now-panel .panel-info .title{
  font-size:calc(22px * var(--scale));font-weight:700;line-height:1.15;
}
.now-panel .panel-info .artist{font-size:calc(14px * var(--scale));color:var(--dim);margin-top:2px}
.now-panel .panel-info .readouts{
  display:flex;flex-wrap:wrap;gap:calc(12px * var(--scale));align-items:baseline;
  font-family:var(--mono);margin-top:calc(6px * var(--scale));
}
.now-panel .panel-info .bpm{font-size:calc(20px * var(--scale));font-weight:700}
.now-panel .panel-info .key{font-size:calc(15px * var(--scale));font-weight:700;color:var(--deck,var(--accent))}
.now-panel .panel-info .deck-tag{
  font-family:var(--mono);font-size:calc(11px * var(--scale));color:var(--deck,var(--accent));
}
.now-panel .panel-phrases{
  width:100%;height:calc(14px * var(--scale));display:none;border-radius:3px;overflow:hidden;
}
.now-panel .panel-phrases.on{display:block}
.now-panel .panel-vocals{
  width:100%;height:calc(8px * var(--scale));display:none;border-radius:2px;overflow:hidden;
  background:#141018;
}
.now-panel .panel-vocals.on{display:block}
.now-panel .next-cue,.now-card .next-cue,.now .next-cue{
  font-family:var(--mono);font-size:calc(13px * var(--scale));font-weight:700;
  font-variant-numeric:tabular-nums;
}
.now-panel .panel-detail{
  width:100%;height:calc(96px * var(--scale));display:block;border-radius:calc(8px * var(--scale));
  background:rgba(0,0,0,.28);
}

.now{
  display:grid;
  grid-template-columns:108px 1fr;
  gap:16px;
  padding:16px 18px;
  align-items:center;
}
.now .art{
  width:108px;height:108px;border-radius:12px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  object-fit:cover;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:34px;color:var(--dimmest);
}
.now .art img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.meta{min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;
  border:1px solid currentColor;color:var(--accent);
}
.tag.deck{color:var(--deck,#22d3ee)}
.tag.master{color:#ffd45e}
.tag.sync{color:var(--dim)}
.tag.onair{color:#ff6b61;background:rgba(255,107,97,.12)}
.tag.loop{color:#2ee89a;background:rgba(46,232,154,.12);display:inline-flex;align-items:center;gap:4px}
.tag.loop svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.hide-tags .tags{display:none}
.hide-bpm .bpm{display:none}
.title{
  font-size:clamp(calc(20px * var(--scale)),2.4vw,calc(28px * var(--scale)));font-weight:700;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.artist{
  margin-top:4px;font-size:clamp(calc(14px * var(--scale)),1.5vw,calc(17px * var(--scale)));color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.readouts{
  margin-top:12px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}
.bpm{font-size:22px;font-weight:700}
.bpm small{font-size:11px;letter-spacing:.12em;color:var(--dimmest);margin-left:4px}
.key{font-size:15px;font-weight:700;color:var(--deck,#22d3ee)}
.time{font-size:13px;color:var(--dim)}
.time .remain{color:var(--dimmest)}
.time .remain.low{color:#ff6b61}
.progress{
  margin-top:10px;height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;
}
.progress > i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--deck,#22d3ee),#fff);
  transition:width .08s linear;
}
.wave{
  margin-top:10px;height:36px;width:100%;max-width:100%;
  border-radius:6px;background:rgba(0,0,0,.35);
  border:1px solid var(--line);overflow:hidden;
  box-sizing:border-box;flex:0 0 auto;
}
.wave canvas{display:block;width:100%;height:100%}
.wave-vocals{width:100%;height:8px;display:none;margin-top:4px;border-radius:2px;background:#141018}
.wave-vocals.on{display:block}

.dual{
  display:grid;gap:12px;padding:14px;
  width:100%;
  max-width:none;
  min-width:0;
}
.dual.decks-2{grid-template-columns:1fr 1fr}
.dual.decks-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dual .slot{
  display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;
  padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.22);
  min-width:0;
}
.dual .art{
  width:64px;height:64px;font-size:22px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--dimmest);
  font-family:var(--mono);overflow:hidden;
}
.dual .art img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.dual .title{font-size:15px}
.dual .artist{font-size:12px}
.dual .bpm{font-size:16px}
.dual .readouts{margin-top:8px;gap:10px}
.dual .progress{margin-top:8px}
.dual .wave{height:28px;margin-top:8px}

.minimal{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px 10px 10px;
  min-width:0;
}
.minimal .art{width:54px;height:54px;border-radius:10px;font-size:20px}
.minimal .art img{border-radius:10px}
.minimal .title{font-size:16px}
.minimal .artist{font-size:12px;margin-top:2px}
.minimal .bpm{margin-left:auto;font-family:var(--mono);font-size:18px;font-weight:700;white-space:nowrap}

.setlist-layout{
  display:flex;flex-direction:column;gap:10px;
  min-width:min(480px,90vw);max-width:min(640px,96vw);
}
.setlist-layout .now{
  padding:14px 16px;
}
.setlist-history{
  display:flex;flex-direction:column;gap:0;
  max-height:min(42vh,420px);
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(0,0,0,.28);
  mask-image:linear-gradient(180deg,#000 70%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 100%);
}
.setlist-row{
  display:grid;
  grid-template-columns:54px 1fr auto;
  gap:10px;align-items:center;
  padding:8px 12px;
  border-bottom:1px solid rgba(255,255,255,.06);
  opacity:0;transform:translateY(8px);
  animation:setlistIn .4s ease forwards;
}
.setlist-row:last-child{border-bottom:none}
.setlist-row .art{
  width:40px;height:40px;border-radius:8px;font-size:16px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--dimmest);
  font-family:var(--mono);overflow:hidden;
}
.setlist-row .art img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.setlist-row .title{font-size:13px;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setlist-row .artist{font-size:11px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setlist-row .meta{min-width:0}
.setlist-row .when{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  color:var(--dimmest);white-space:nowrap;
}
@keyframes setlistIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

.next-third{
  display:none;
  margin-top:10px;
  padding:10px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(0,0,0,.35);
  min-width:min(calc(420px * var(--scale)),90vw);
  opacity:0;transform:translateY(8px);
  transition:opacity .35s ease, transform .35s ease;
}
.next-third.show{display:block;opacity:1;transform:none}
.next-third .eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:4px;
}
.next-third .title{font-size:clamp(14px,1.6vw,18px)}
.next-third .artist{font-size:12px}
.next-third .bar{
  margin-top:8px;height:3px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;
}
.next-third .bar > i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),#fff);
  transition:width .2s linear;
}

#idle{
  display:none;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dimmest);padding:10px 14px;border:1px dashed var(--line);border-radius:10px;
  background:rgba(0,0,0,.25);
}
#idle.show{display:inline-block}

@media (max-width:1100px){
  .dual.decks-4{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .dual.decks-2,.dual.decks-4{grid-template-columns:1fr}
  .now{grid-template-columns:84px 1fr}
  .now .art{width:84px;height:84px}
}
</style>
</head>
<body>
<div id="root">
  <div id="stack">
    <div id="idle">waiting for player</div>
    <div id="card" class="card"></div>
    <div id="next" class="next-third"></div>
  </div>
</div>

<script>
const DECK_COLORS = {1:'#ffb020',2:'#22d3ee',3:'#f472b6',4:'#4ade80',5:'#ffb020',6:'#22d3ee'};
const params = new URLSearchParams(location.search);
const layout = ['nowplaying','dual','minimal','setlist'].includes(params.get('layout'))
  ? params.get('layout') : 'nowplaying';
const corner = ['bl','br','tl','tr','center'].includes(params.get('corner'))
  ? params.get('corner') : 'bl';
const nowStyle = params.get('style') === 'panel' ? 'panel' : 'card';
const floatWindow = params.get('float') === '1';
function normalizeCardPos(raw) {
  const r = String(raw || 'bl').toLowerCase();
  const alias = { left: 'bl', right: 'br' };
  const p = alias[r] || r;
  return ['tl', 'tr', 'bl', 'br'].includes(p) ? p : 'bl';
}
const nowPosRaw = (params.get('pos') || (nowStyle === 'panel' ? 'bottom' : 'bl')).toLowerCase();
const nowPos = nowStyle === 'panel'
  ? (nowPosRaw === 'top' ? 'top' : 'bottom')
  : normalizeCardPos(nowPosRaw);
const PLAYHEAD_LEFT_FRACTION = 0.25;
const DEFAULT_BPM = 120;
const ZOOM_BARS_OPTS = [1, 2, 4, 8, 16];
let showPhrasesDisplay = true;
let showVocalsDisplay = true;
let showNextCueDisplay = true;
let showSpectrum = true;
let zoomBarsDisplay = 4;
let playheadModeDisplay = 'auto';
const onlyPlaying = params.get('playing') !== '0';
const preview = params.get('preview') === '1';
const embed = params.get('embed') === '1';
const useMix = params.get('mix') !== '0';
const maxDecks = Math.min(4, Math.max(1, +(params.get('decks') || (layout === 'dual' ? 2 : 1))));
const WAVE_STYLES = ['rgb', '3band', 'blue'];
const waveStyle = WAVE_STYLES.includes(params.get('wave')) ? params.get('wave') : 'rgb';
const spread = layout === 'dual';
const SETLIST_MAX = 12;
const showTags = params.get('tags') !== '0';
const showBpm = params.get('bpm') !== '0';
const showNext = params.get('next') !== '0';
let scale = parseFloat(params.get('scale') || params.get('font') || '1');
if (!Number.isFinite(scale)) scale = 1;
scale = Math.max(0.5, Math.min(2.5, scale));
const accentParam = (params.get('accent') || '').trim();
const accent = /^#?[0-9a-fA-F]{6}$/.test(accentParam)
  ? (accentParam.startsWith('#') ? accentParam : '#' + accentParam)
  : '';

if (preview) document.body.classList.add('preview');
if (embed) document.body.classList.add('embed');
if (floatWindow) document.body.classList.add('float-window');
const root = document.getElementById('root');
if (embed) root.classList.add('embed-mode');
if (layout === 'nowplaying') {
  if (nowStyle === 'panel') {
    root.classList.add('now-panel-mode', nowPos === 'top' ? 'now-panel-top' : 'now-panel-bottom');
  } else {

function deckCacheId(deck) {

function trackApiQuery(deck) {
  const id = deck.track_id || 0;

function mmss(ms){
  ms = Math.max(0, ms|0);
  const t = Math.floor(ms/1000);
  return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

function remainHtml(pos, dur){
  if (!dur) return '';
  const rem = Math.max(0, dur - pos);
  const low = rem < 30000 ? ' low' : '';
  return `<span class="remain${low}">-${mmss(rem)}</span>`;
}

function timeHtml(pos, dur){
  if (!dur) return mmss(pos);
  return `${mmss(pos)} / ${remainHtml(pos, dur)}`;
}

function overlayDuration(deck, pack){
  const deckDur = +(deck && deck.duration_ms || 0);
  const metaDur = +(pack && pack.meta && pack.meta.duration_ms || 0);
  const sane = d => d > 1000 && d < 12 * 3600 * 1000;
  if (sane(deckDur) && sane(metaDur)) {
    if (deckDur > metaDur * 2) return metaDur;
    if (metaDur > deckDur * 2) return deckDur;
    return Math.max(deckDur, metaDur);
  }
  if (sane(metaDur)) return metaDur;
  if (sane(deckDur)) return deckDur;
  return metaDur || deckDur || 0;
}

const DECK_LAYOUT = {2: [1, 2], 4: [3, 1, 2, 4]};

function visibleDecks(list){
  const byNum = new Map((list || []).map(d => [d.number, d]));
  const layoutN = maxDecks >= 4 ? 4 : 2;
  const order = DECK_LAYOUT[layoutN] || DECK_LAYOUT[2];
  let rows = [];
  for (const n of order) {
    const d = byNum.get(n);
    if (d) rows.push(d);
  }
  if (onlyPlaying) rows = rows.filter(d => d.playing || d.track_id);
  return rows.slice(0, maxDecks);
}

function pickAudienceDeck(state) {
  const list = state.decks || [];
  const aud = state.audience_deck;
  if (aud && aud.number) {
    const live = list.find(d => d.number === aud.number);
    const deck = live ? Object.assign({}, aud, live) : aud;
    if (deck.track_id || deck.playing) return deck;
  }
  return null;
}

function pickDecks(state){
  const list = state.decks || [];
  if (layout === 'dual') return visibleDecks(list);
  if (layout === 'nowplaying' || layout === 'minimal' || layout === 'setlist') {
    const aud = pickAudienceDeck(state);
    if (aud) return [aud];
  }
  if (!useMix) return visibleDecks(list);
  const np = state.now_playing;
  if (np && np.number) {
    const live = list.find(d => d.number === np.number);
    const deck = live ? Object.assign({}, np, live) : np;
    if (deck.track_id || deck.playing) return [deck];
  }
  return visibleDecks(list);
}

function readWaveform(buf, off){ return ProlinkWave.readWaveform(buf, off); }

const waveRetryAt = new Map();

async function loadTrack(deck){
  const id = deck.track_id;
  const cacheId = deckCacheId(deck);
  if (!id || !cacheId || tracks.has(cacheId) || pending.has(cacheId)) return;
  if ((waveRetryAt.get(cacheId) || 0) > Date.now()) return;
  pending.add(cacheId);
  const qs = trackApiQuery(deck);
  try{
    const [meta, buf] = await Promise.all([
      fetch(`/api/track/${id}${qs}`).then(r => r.ok ? r.json() : null),
      fetch(`/api/waveform/${id}${qs}`).then(r => r.ok ? r.arrayBuffer() : null),
    ]);
    if (!meta || !buf) {
      waveRetryAt.set(cacheId, Date.now() + 1200);
      return;
    }
    if (deck.track_key && meta.track_key && meta.track_key !== deck.track_key) return;
    const decoded = ProlinkWave.decodeWavePack(buf);
    if (!decoded.detail && !decoded.overview) {
      waveRetryAt.set(cacheId, Date.now() + 1200);
      return;
    }
    waveRetryAt.delete(cacheId);
    tracks.set(cacheId, {
      meta, detail: decoded.detail, overview: decoded.overview, track_id: id,
    });
  } catch (_) {
    waveRetryAt.set(cacheId, Date.now() + 1200);
  } finally { pending.delete(cacheId); }
}

function artQuery(deck, size){

}

let _mockArt = null;
function mockArtDataUri(size){
  if (!_mockArt) _mockArt = {};
  const key = size === 'large' ? 'large' : 'small';
  if (_mockArt[key]) return _mockArt[key];
  const px = key === 'large' ? 500 : 48;
  const cv = document.createElement('canvas');
  cv.width = px; cv.height = px;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, px, px);
  g.addColorStop(0, '#14304a');
  g.addColorStop(1, '#0b1016');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.arc(px * 0.5, px * 0.42, px * 0.28, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffb020';
  ctx.fillRect(px * 0.18, px * 0.72, px * 0.64, Math.max(2, px * 0.06));
  if (key === 'large') {
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = Math.max(1, px * 0.008);
    for (let i = 1; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo(px * 0.12, px * (0.15 + i * 0.1));
      ctx.lineTo(px * 0.88, px * (0.15 + i * 0.1));
      ctx.stroke();
    }
  }
  ctx.fillStyle = '#f4f6fb';
  ctx.font = `700 ${Math.round(px * 0.16)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(key === 'large' ? 'HI-RES' : 'AZ', px / 2, px * 0.46);
  _mockArt[key] = cv.toDataURL('image/jpeg', key === 'large' ? 0.92 : 0.7);
  return _mockArt[key];
}

function artHtml(deck, pack, size){
  const trackId = deck && deck.track_id;
  const meta = pack && pack.meta;
  const variant = size === 'large' ? 'large' : (size === 'small' ? 'small' : '');
  if (params.get('mock') === '1' && trackId)
    return `<div class="art"><img alt="" src="${mockArtDataUri(variant || 'small')}"></div>`;
  if (trackId && meta && meta.has_artwork) {
    const id = trackId;
    return `<div class="art"><img alt="" src="/api/artwork/${id}${artQuery(deck, variant)}"></div>`;
  }
  return `<div class="art">♪</div>`;
}

function loopBeats(loop, bpm) {
  if (!loop || !bpm || bpm <= 0) return 0;
  const ms = Math.max(0, (loop.end || 0) - (loop.t || 0));
  return Math.max(0, Math.round(ms / (60000 / bpm)));
}

function wrapLoopPosition(pos, looping, start, end) {
  // Same rule as prolink.link.wrap_loop_position.
  if (!looping || start == null || end == null || !(+end > +start)) return pos;
  const a = +start, b = +end, len = b - a;
  if (pos >= b) return a + (((pos - a) % len) + len) % len;
  if (pos < a && a - pos < len) return a;
  return pos;
}

function activeLoop(meta, pos, looping, deck) {
  if (looping && deck && +deck.loop_end_ms > +deck.loop_start_ms) {
    return {type: 'loop', t: +deck.loop_start_ms, end: +deck.loop_end_ms};
  }
  if (!meta || !meta.cues) return null;
  const loops = meta.cues.filter(c => c.type === 'loop' && c.end > c.t);
  if (!loops.length) return null;
  const inside = loops.find(c => pos >= c.t && pos <= c.end);
  if (inside) return inside;
  return looping ? loops[0] : null;
}

const LOOP_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
  <path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
</svg>`;

function tagsHtml(deck, pack, pos){
  const bits = [`<span class="tag deck">DECK ${deck.number}</span>`];
  if (deck.master) bits.push('<span class="tag master">MASTER</span>');
  if (deck.sync) bits.push('<span class="tag sync">SYNC</span>');
  if (deck.on_air) bits.push('<span class="tag onair">ON AIR</span>');
  const looping = deck.state === 'looping';
  if (looping) {
    const loop = activeLoop(pack && pack.meta, pos || 0, true, deck);
    const beats = loopBeats(loop, deck.track_bpm || deck.bpm);
    const label = beats ? String(beats) : 'LOOP';
    bits.push(`<span class="tag loop" title="Loop">${LOOP_ICON}${label}</span>`);
  }
  return `<div class="tags">${bits.join('')}</div>`;
}

function progressPct(pos, dur){
  if (!dur) return 0;
  return Math.max(0, Math.min(100, (pos/dur)*100));
}

function waveHtml(trackId){
  return `<div class="wave"><canvas data-wave="${trackId||0}"></canvas></div>`
    + `<canvas class="wave-vocals" data-vocals="${trackId||0}"></canvas>`;
}

function nextMark(pos, meta) {
  if (!meta) return null;
  let best = null;
  for (const cue of (meta.cues || [])) {
    if (cue.type === 'loop') continue;
    const t = +(cue.t != null ? cue.t : cue.time);
    if (!isFinite(t) || t <= pos + 1) continue;
    const hot = +(cue.hot || cue.hot_cue || 0);
    const named = String(cue.text || cue.comment || '').trim();
    const name = named || (hot > 0 ? ('CUE ' + (hot <= 26 ? String.fromCharCode(64 + hot) : hot)) : 'MEMORY');
    if (!best || t < best.t) best = {name, t, remain: t - pos};
  }
  const beats = meta.beats || [];
  for (const ph of (meta.phrases || [])) {
    let t = ph.t != null ? +ph.t : NaN;
    if (!isFinite(t)) {
      const beat = (ph.beat | 0) - 1;
      if (beat >= 0 && beat < beats.length) t = +beats[beat][0];
    }
    if (!isFinite(t) || t <= pos + 1) continue;
    const name = String(ph.text || ph.label || 'PHRASE').trim() || 'PHRASE';
    if (!best || t < best.t) best = {name, t, remain: t - pos};
  }
  return best;
}

function formatNext(mark) {
  if (!mark) return '';
  const total = Math.floor(Math.max(0, mark.remain) / 1000);
  return 'NEXT: ' + mark.name + ' in ' + Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
}

function nextColor(remain) {
  if (remain <= 3000) return '#ff3b30';
  if (remain <= 10000) return '#ff9f45';
  return '#e8eaf0';
}

function nextCueHtml() {

}

function paintNextEl(el, pos, meta) {

  if (!showNextCueDisplay || !meta) { el.textContent = ''; return; }
  const mark = nextMark(pos, meta);
  el.textContent = formatNext(mark);
  el.style.color = mark ? nextColor(mark.remain) : '';
}

function paintVocalCanvas(cv, pack, pos) {
  if (!cv) return;
  const spans = (showVocalsDisplay && pack && pack.meta && pack.meta.vocals) || [];
  cv.classList.toggle('on', spans.length > 0);
  if (!spans.length) return;
  const r = window.devicePixelRatio || 1;
  const cssW = Math.max(1, Math.round(cv.clientWidth || 800));
  const cssH = Math.max(1, Math.round(cv.clientHeight || 8));
  const W = Math.round(cssW * r), H = Math.round(cssH * r);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const dur = (pack.meta && pack.meta.duration_ms) || 1;
  ctx.fillStyle = '#f472b6';
  for (const span of spans) {
    const x1 = (span.t / dur) * W;
    const x2 = (span.end / dur) * W;
    ctx.fillRect(x1, r, Math.max(1, x2 - x1), Math.max(1, H - 2 * r));
  }
  const px = Math.max(0, Math.min(W, (pos / dur) * W));
  if (px < W) {
    ctx.fillStyle = 'rgba(8,10,12,.45)';
    ctx.fillRect(px, 0, W - px, H);
  }
}

function paintWaveCanvas(cv, pack, pos, color, looping, deck){
  if (!cv) return;
  const r = window.devicePixelRatio || 1;
  const cssW = Math.max(1, Math.round(cv.clientWidth || cv.parentElement.clientWidth || 120));
  const cssH = Math.max(1, Math.round(cv.clientHeight || 28));
  const W = Math.round(cssW * r), H = Math.round(cssH * r);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect(0, 0, W, H);
  const ov = pack && pack.overview;
  if (!ov || !ov.n) return;
  const mid = H / 2, span = mid * 0.9;
  const colW = Math.max(1, Math.round(r));
  for (let x = 0; x < cssW; x++) {
    const i = Math.min(ov.n - 1, Math.floor(x * ov.n / cssW));
    const amp = (ov.h[i] / 31) * span;
    fillOverlayColumn(ctx, Math.round(x * r), mid, amp, i, ov, span, colW);
  }
  const dur = (pack.meta && pack.meta.duration_ms) || ov.dur || 1;
  const px = Math.max(0, Math.min(W, (pos / dur) * W));
  const loop = activeLoop(pack && pack.meta, pos, looping, deck);
  if (loop) {
    const x0 = (loop.t / dur) * W, x1 = (loop.end / dur) * W;
    ctx.fillStyle = 'rgba(46,232,154,.30)';
    ctx.fillRect(x0, 0, Math.max(1, x1 - x0), H);
  }
  // Cue markers on the overlay mini-wave.
  if (pack.meta && pack.meta.cues) {
    for (const c of pack.meta.cues) {
      if (c.type === 'loop') continue;
      const cx = (c.t / dur) * W;
      ctx.fillStyle = c.color ? `rgb(${c.color[0]},${c.color[1]},${c.color[2]})`
                              : (c.hot ? '#ffd45e' : '#ffffff');
      ctx.fillRect(cx - r, 0, Math.max(2, Math.round(2 * r)), H);
      if (c.hot) {
        const bw = 10 * r, bh = 8 * r;
        ctx.fillRect(cx - bw / 2, 0, bw, bh);
        ctx.fillStyle = '#000';
        ctx.font = `700 ${7 * r}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(String.fromCharCode(64 + c.hot), cx, 6.5 * r);
      }
    }
  }
  ctx.fillStyle = 'rgba(8,10,12,.55)';
  ctx.fillRect(px, 0, W - px, H);
  ctx.fillStyle = color || '#22d3ee';
  ctx.fillRect(px - r, 0, Math.max(2, Math.round(2 * r)), H);
}

function fillMirrored(ctx, x, mid, amp, colW){
  if (amp < 0.5) return;
  ctx.fillRect(x, Math.round(mid - amp), colW, Math.max(1, Math.round(amp * 2)));
}

function fillOverlayColumn(ctx, x, mid, amp, src, wave, span, colW){
  if (waveStyle === '3band') {
    const low = wave.low && wave.low[src];
    const md = wave.mid && wave.mid[src];
    const hi = wave.high && wave.high[src];
    const peak = wave.bandPeak || 31;
    if (peak >= 2 && (low || md || hi)) {
      const lowPx = (low || 0) / peak * span;
      const midPx = (md || 0) / peak * span;
      const highPx = (hi || 0) / peak * span;
      if (lowPx > midPx) {
        ctx.fillStyle = 'rgb(32,83,217)'; fillMirrored(ctx, x, mid, lowPx, colW);
        ctx.fillStyle = 'rgb(169,107,39)'; fillMirrored(ctx, x, mid, midPx, colW);
      } else {
        if (Math.abs(lowPx - midPx) >= 0.4) {
          ctx.fillStyle = 'rgb(242,170,60)'; fillMirrored(ctx, x, mid, midPx, colW);
        }
        ctx.fillStyle = 'rgb(169,107,39)'; fillMirrored(ctx, x, mid, lowPx, colW);
      }
      ctx.fillStyle = 'rgb(255,255,255)'; fillMirrored(ctx, x, mid, highPx, colW);
      return;
    }
  }
  let drawAmp = amp;
  if (waveStyle === 'blue') {
    if (wave.blueH && wave.blueH.length === wave.n) drawAmp = (wave.blueH[src] / 31) * span;
    if (wave.blueRgb && wave.blueRgb.length === wave.n * 3) {
      const b = wave.blueRgb;
      ctx.fillStyle = `rgb(${b[src * 3]},${b[src * 3 + 1]},${b[src * 3 + 2]})`;
    } else ctx.fillStyle = 'rgb(0,168,232)';
  } else {
    const rgb = wave.rgb;
    ctx.fillStyle = `rgb(${rgb[src * 3]},${rgb[src * 3 + 1]},${rgb[src * 3 + 2]})`;
  }
  fillMirrored(ctx, x, mid, drawAmp, colW);
}

function barsToSeconds(bars, bpm) {
  const b = (bpm && bpm > 0) ? bpm : DEFAULT_BPM;
  return Math.max(0.25, bars * 4 * 60 / b);
}

function modelDefaultsLeft(name) {
  const compact = String(name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  return compact.includes('xdjaz') || compact.includes('opusquad');
}

function playheadAnchorForDeck(deck) {
  let pos = 'centre';
  if (playheadModeDisplay === 'left' || playheadModeDisplay === 'centre') pos = playheadModeDisplay;
  else if (deck && (deck.waveform_position === 'left' || deck.waveform_position === 'centre')) {
    pos = deck.waveform_position;
  } else if (modelDefaultsLeft(deck && deck.name)) pos = 'left';
  return pos === 'left' ? PLAYHEAD_LEFT_FRACTION : 0.5;
}

function phraseColor(label) {
  const t = String(label || '').toLowerCase();
  if (t.startsWith('intro')) return 'rgba(120,180,255,.92)';
  if (t.startsWith('verse')) return 'rgba(160,220,120,.92)';
  if (t.startsWith('bridge')) return 'rgba(200,160,255,.92)';
  if (t.startsWith('chorus') || t.startsWith('drop')) return 'rgba(255,120,90,.92)';
  if (t.startsWith('up')) return 'rgba(255,190,80,.92)';
  if (t.startsWith('outro')) return 'rgba(160,160,180,.92)';
  return 'rgba(200,200,210,.88)';
}

function paintPanelPhrases(cv, pack, pos) {
  if (!cv) return;
  const track = pack;
  const on = showPhrasesDisplay && track && track.meta && (track.meta.phrases || []).length;
  cv.classList.toggle('on', !!on);
  if (!on) return;
  const r = window.devicePixelRatio || 1;
  const cssW = Math.max(1, Math.round(cv.clientWidth || 800));
  const cssH = Math.max(1, Math.round(cv.clientHeight || 14));
  const W = Math.round(cssW * r), H = Math.round(cssH * r);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const dur = track.meta.duration_ms || (track.overview && track.overview.dur) || 1;
  const beats = track.meta.beats || [];
  const phrases = track.meta.phrases || [];
  const starts = [];
  for (const ph of phrases) {
    const bi = (ph.beat | 0) - 1;
    if (bi < 0 || bi >= beats.length) continue;
    starts.push({t: beats[bi][0], ph});
  }
  starts.sort((a, b) => a.t - b.t);
  for (let i = 0; i < starts.length; i++) {
    const start = starts[i].t;
    const end = i + 1 < starts.length ? starts[i + 1].t : dur;
    const x1 = (start / dur) * cssW * r;
    const x2 = (end / dur) * cssW * r;
    ctx.fillStyle = phraseColor(starts[i].ph.text);
    ctx.fillRect(x1, 0, Math.max(1, x2 - x1), H);
  }
  const px = Math.max(0, Math.min(W, (pos / dur) * W));
  if (px < W) {
    ctx.fillStyle = 'rgba(8,10,12,.35)';
    ctx.fillRect(px, 0, W - px, H);
  }
}

function paintPanelDetail(cv, pack, pos, deck, playing, looping) {
  if (!cv) return;
  const track = pack;
  const r = window.devicePixelRatio || 1;
  const cssW = Math.max(1, Math.round(cv.clientWidth || 800));
  const cssH = Math.max(1, Math.round(cv.clientHeight || 96));
  const W = Math.round(cssW * r), H = Math.round(cssH * r);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  if (!track || !track.detail || !track.detail.n) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(0, 0, W, H);
    cv._panelCache = null;
    return;
  }
  const {n, cps, h} = track.detail;
  const mid = H / 2;
  const span = mid * 0.98;
  const colW = Math.max(1, Math.round(r));
  const bpm = deck.track_bpm || deck.bpm || DEFAULT_BPM;
  const bars = ZOOM_BARS_OPTS.includes(zoomBarsDisplay) ? zoomBarsDisplay : 4;
  const visibleSeconds = barsToSeconds(bars, bpm);
  const visibleCols = visibleSeconds * cps;
  const pxPerCol = cssW / visibleCols;
  const currentCol = (pos / 1000) * cps;
  const needle = playheadAnchorForDeck(deck);
  const start = currentCol - visibleCols * needle;
  const color = DECK_COLORS[deck.number] || '#22d3ee';
  const key = `${deck.track_id}|${deck.track_key}|${waveStyle}|${bars}|${Math.round(bpm)}|${cssW}|${H}|${needle}`;

  function paintRange(o, rangeStart, xLo, xHi) {
    const meta = track.meta;
    if (meta && meta.beats && meta.beats.length) {
      o.lineWidth = Math.max(1, r * 0.5);
      const t0 = ((rangeStart + xLo / pxPerCol) / cps) * 1000;
      const t1 = ((rangeStart + xHi / pxPerCol) / cps) * 1000;
      for (const [t] of meta.beats) {
        if (t < t0 - 500) continue;
        if (t > t1 + 500) break;
        const x = ((t / 1000) * cps - rangeStart) * pxPerCol;
        if (x < xLo - 1 || x > xHi) continue;
        o.strokeStyle = 'rgba(255,255,255,.08)';
        o.beginPath(); o.moveTo(Math.round(x * r), 0); o.lineTo(Math.round(x * r), H); o.stroke();
      }
    }
    for (let x = xLo; x < xHi; x++) {
      let lo = Math.floor(rangeStart + x / pxPerCol);
      let hi = Math.ceil(rangeStart + (x + 1) / pxPerCol);
      if (hi <= lo) hi = lo + 1;
      if (hi <= 0 || lo >= n) continue;
      if (lo < 0) lo = 0;
      if (hi > n) hi = n;
      let tall = 0, src = lo;
      for (let i = lo; i < hi; i++) if (h[i] > tall) { tall = h[i]; src = i; }
      const amp = (tall / 31) * span;
      fillOverlayColumn(o, Math.round(x * r), mid, amp, src, track.detail, span, colW);
    }
  }

  let cache = cv._panelCache || {};
  if (cache.key !== key || !cache.off) {
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const o = off.getContext('2d');
    o.imageSmoothingEnabled = false;
    o.clearRect(0, 0, W, H);
    paintRange(o, start, 0, cssW);
    cache = {key, off, start, scratch: cache.scratch || null};
    cv._panelCache = cache;
  } else {
    const shiftF = (cache.start - start) * pxPerCol;
    const shift = shiftF | 0;
    if (Math.abs(shift) >= cssW) {
      const o = cache.off.getContext('2d');
      o.clearRect(0, 0, W, H);
      paintRange(o, start, 0, cssW);
      cache.start = start;
    } else if (shift !== 0) {
      let scratch = cache.scratch || document.createElement('canvas');
      if (scratch.width !== W || scratch.height !== H) { scratch.width = W; scratch.height = H; }
      const o = scratch.getContext('2d');
      o.imageSmoothingEnabled = false;
      o.clearRect(0, 0, W, H);
      if (shift > 0) {
        o.drawImage(cache.off, Math.round(shift * r), 0);
        paintRange(o, start, 0, shift);
      } else {
        const sh = -shift;
        o.drawImage(cache.off, Math.round(-sh * r), 0);
        paintRange(o, start, cssW - sh, cssW);
      }
      cache.scratch = cache.off;
      cache.off = scratch;
      cache.start -= shift / pxPerCol;
    }
    cv._panelCache = cache;
  }

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(cache.off, 0, 0);

  const loop = activeLoop(track.meta, pos, looping, deck);
  if (loop) {
    // Lock the highlight to the true playhead window, not the scrolled cache.
    const x0 = ((loop.t / 1000) * cps - start) * pxPerCol * r;
    const x1 = ((loop.end / 1000) * cps - start) * pxPerCol * r;
    ctx.fillStyle = 'rgba(46,232,154,.30)';
    ctx.fillRect(x0, 0, Math.max(1, x1 - x0), H);
  }

  const px = W * needle;
  ctx.fillStyle = color;
  ctx.globalAlpha = playing ? .18 : .07;
  ctx.fillRect(px - 9 * r, 0, 18 * r, H);
  ctx.globalAlpha = 1;
  ctx.fillRect(px - r, 0, Math.max(2, Math.round(2 * r)), H);
}

function renderNowPanel(deck, pos) {
  const pack = trackPack(deck);
  const meta = pack && pack.meta;
  const keyOk = !meta || !deck.track_key || meta.track_key === deck.track_key;
  const title = (meta && keyOk) ? (meta.title || '—') : (deck.track_id ? 'loading…' : 'no track');
  const artist = (meta && keyOk) ? (meta.artist || '') : '';
  const key = (meta && keyOk) ? (meta.key || '') : '';
  const color = DECK_COLORS[deck.number] || '#22d3ee';
  const info = `
    <div class="panel-info">
      ${artHtml(deck, pack, 'small')}
      <div class="copy">
        ${tagsHtml(deck, pack, pos)}
        <div class="title">${escapeHtml(title)}</div>
        <div class="artist">${escapeHtml(artist)}</div>
        <div class="readouts">
          <div class="bpm">${deck.bpm ? deck.bpm.toFixed(2) : '—'}<small>BPM</small></div>
          ${key ? `<div class="key">${escapeHtml(key)}</div>` : ''}
          <div class="deck-tag">DECK ${deck.number}</div>
          ${nextCueHtml()}
        </div>
      </div>
    </div>`;
  const phrases = '<canvas class="panel-phrases"></canvas><canvas class="panel-vocals"></canvas>';
  const spectrum = showSpectrum ? '<canvas class="panel-spectrum"></canvas>' : '';
  const detail = '<canvas class="panel-detail"></canvas>';
  // Spectrum sits in the gap the smaller artwork leaves next to the waveform.
  const blocks = nowPos === 'top'
    ? `${detail}${spectrum}${phrases}${info}`
    : `${info}${phrases}${spectrum}${detail}`;
  return `<div class="now-panel" style="--deck:${color}">${blocks}</div>`;
}

function renderNow(deck, pos, compact=false){
  const pack = trackPack(deck);
  const meta = pack && pack.meta;
  const keyOk = !meta || !deck.track_key || meta.track_key === deck.track_key;
  const title = (meta && keyOk) ? (meta.title || '—') : (deck.track_id ? 'loading…' : 'no track');
  const artist = (meta && keyOk) ? (meta.artist || '') : '';
  const key = (meta && keyOk) ? (meta.key || '') : '';
  const color = DECK_COLORS[deck.number] || '#22d3ee';
  const inner = `
        ${tagsHtml(deck, pack, pos)}
        <div class="title">${escapeHtml(title)}</div>
        <div class="artist">${escapeHtml(artist)}</div>
        <div class="readouts">
          <div class="bpm">${deck.bpm ? deck.bpm.toFixed(2) : '—'}<small>BPM</small></div>
          ${key ? `<div class="key">${escapeHtml(key)}</div>` : ''}
          <div class="time" data-time>${timeHtml(pos, overlayDuration(deck, pack))}</div>
          ${nextCueHtml()}
        </div>
        ${compact ? waveHtml(deck.track_id) : ''}
        <div class="progress"><i style="width:${progressPct(pos, overlayDuration(deck, pack))}%"></i></div>`;
  if (compact) {
    return `
    <div class="now" style="--deck:${color}">
      ${artHtml(deck, pack, 'small')}
      <div class="meta">${inner}</div>
    </div>`;
  }
  return `
    <div class="now-card" style="--deck:${color}">
      ${artHtml(deck, pack, 'large')}
      <div class="meta">${inner}${waveHtml(deck.track_id)}</div>
    </div>`;
}

function renderMinimal(deck, pos){
  const pack = trackPack(deck);
  const meta = pack && pack.meta;
  const title = meta ? (meta.title || '—') : (deck.track_id ? 'loading…' : 'no track');
  const artist = meta ? (meta.artist || '') : '';
  const color = DECK_COLORS[deck.number] || '#22d3ee';
  return `
    <div class="minimal" style="--deck:${color}">
      ${artHtml(deck, pack, 'small')}
      <div class="meta" style="min-width:0">
        <div class="title">${escapeHtml(title)}</div>
        <div class="artist">${escapeHtml(artist)}</div>
      </div>
      <div class="bpm" style="color:${color}">${deck.bpm ? deck.bpm.toFixed(1) : '—'}</div>
    </div>`;
}

function setlistClock(startedAt){
  if (!startedAt) return '';
  const d = new Date(startedAt * 1000);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
}

function renderSetlistHistory(entries, current){
  const curId = current && current.track_id;
  const curDeck = current && current.number;
  // Newest first under now-playing; drop the live track so it isn't duplicated.
  const hist = (entries || [])
    .filter(e => !(e.track_id === curId && e.deck === curDeck))
    .slice()
    .reverse()
    .slice(0, SETLIST_MAX);
  if (!hist.length) {
    return `<div class="setlist-history"><div class="setlist-row" style="animation-delay:0s;opacity:.55;grid-template-columns:1fr">
      <div class="artist" style="margin:0">set history appears here</div>
    </div></div>`;
  }
  return `<div class="setlist-history">${hist.map((e, i) => {
    const histDeck = {track_id: e.track_id, number: e.deck || 1, track_key: e.track_key || ''};
    const pack = trackPack(histDeck);
    const meta = pack && pack.meta;
    const title = (meta && meta.title) || e.title || '—';
    const artist = (meta && meta.artist) || e.artist || '';
    const color = DECK_COLORS[e.deck] || '#22d3ee';
    const when = setlistClock(e.reported_at || e.started_at);
    if (e.track_id) loadTrack(histDeck);
    return `<div class="setlist-row" style="--deck:${color};animation-delay:${Math.min(i, 6) * 0.04}s">
      ${artHtml(histDeck, pack, 'small')}
      <div class="meta">
        <div class="title">${escapeHtml(title)}</div>
        <div class="artist">${escapeHtml(artist)}${e.deck ? ` · D${e.deck}` : ''}</div>
      </div>
      <div class="when">${escapeHtml(when)}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderSetlist(deck, pos, setlist){
  return `<div class="setlist-layout">
    ${renderNow(deck, pos, true)}
    ${renderSetlistHistory(setlist, deck)}
  </div>`;
}

function renderDual(decks, positions){
  const cols = maxDecks >= 4 ? 4 : 2;
  return `<div class="dual decks-${cols}">${decks.map((d,i)=>{
    const pack = trackPack(d);
    const meta = pack && pack.meta;
    const title = meta ? (meta.title || '—') : (d.track_id ? 'loading…' : 'no track');
    const artist = meta ? (meta.artist || '') : '';
    return `
    <div class="slot" style="--deck:${DECK_COLORS[d.number]||'#22d3ee'}">
      ${artHtml(d, pack, 'small')}
      <div class="meta">
        ${tagsHtml(d, pack, positions[i])}
        <div class="title">${escapeHtml(title)}</div>
        <div class="artist">${escapeHtml(artist)}</div>
        <div class="readouts">
          <div class="bpm">${d.bpm?d.bpm.toFixed(2):'—'}<small>BPM</small></div>
          <div class="time" data-time>${timeHtml(positions[i], overlayDuration(d, pack))}</div>
        </div>
        ${waveHtml(d.track_id)}
        <div class="progress"><i style="width:${progressPct(positions[i], overlayDuration(d, pack))}%"></i></div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderNextThird(pending){
  const el = document.getElementById('next');
  if (!el) return;
  if (!showNext || !pending || !pending.track_id) {
    el.classList.remove('show');
    el.innerHTML = '';
    return;
  }
  const pendDeck = {
    track_id: pending.track_id,
    number: pending.deck || 1,
    track_key: pending.track_key || '',
  };
  if (pending.track_id) loadTrack(pendDeck);
  const pack = trackPack(pendDeck);
  const meta = pack && pack.meta;
  const title = (meta && meta.title) || pending.title || '—';
  const artist = (meta && meta.artist) || pending.artist || '';
  const pct = Math.max(0, Math.min(100, (pending.progress || 0) * 100));
  const beats = pending.beats != null ? Math.round(pending.beats) : '';
  const need = pending.need_beats || '';
  el.innerHTML = `
    <div class="eyebrow">next · deck ${pending.deck || '—'}${beats !== '' ? ` · ${beats}/${need} beats` : ''}</div>
    <div class="title">${escapeHtml(title)}</div>
    <div class="artist">${escapeHtml(artist)}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
  el.classList.add('show');
}

let spectrumLevels = null;
let spectrumKey = '';
let spectrumStamp = 0;
let loopbackBins = null;
let loopbackAt = 0;

function paintSpectrum(cv, pack, pos, deck, playing) {
  if (!cv) return;
  const r = window.devicePixelRatio || 1;
  const cssW = Math.max(1, Math.round(cv.clientWidth || cv.parentElement && cv.parentElement.clientWidth || 640));
  const cssH = Math.max(1, Math.round(cv.clientHeight || 72));
  const W = Math.round(cssW * r), H = Math.round(cssH * r);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const now = performance.now();
  const dt = spectrumStamp ? Math.min(0.25, (now - spectrumStamp) / 1000) : 0.016;
  spectrumStamp = now;
  const detail = pack && pack.detail;
  const key = detail ? `${deck.track_id}|${deck.track_key || ''}|${detail.n}` : '';
  if (key !== spectrumKey) {
    spectrumKey = key;
    spectrumLevels = null;
  }
  const api = window.ProlinkSpectrum;
  const wantLoop = last && last.display && last.display.spectrum_source === 'loopback';
  const useLoop = wantLoop && loopbackBins && (now - loopbackAt) < 500;
  let result = null;
  if (useLoop) {
    const target = loopbackBins;
    const nBars = target.length;
    if (!spectrumLevels || spectrumLevels.length !== nBars) {
      spectrumLevels = target.slice();
    }
    const k = playing ? (1 - Math.exp(-dt / 0.06)) : (1 - Math.exp(-dt / 0.2));
    for (let i = 0; i < nBars; i++) {
      const goal = playing ? target[i] : target[i] * 0.35;
      spectrumLevels[i] = spectrumLevels[i] + (goal - spectrumLevels[i]) * k;
    }
    result = { levels: spectrumLevels };
  } else if (api && detail && detail.n) {
    const col = (pos / 1000) * (detail.cps || 150);
    result = api.spectrumBars({
      low: detail.low || null,
      mid: detail.mid || null,
      high: detail.high || null,
      height: detail.h || null,
      columns: detail.n,
      column: col,
      peak: detail.bandPeak || 31,
      prev: spectrumLevels,
      dt: dt,
      playing: !!playing,
    });
    spectrumLevels = result.levels;
  }
  const levels = result && result.levels;
  const n = levels ? levels.length : (api ? api.BARS : 48);
  const gap = Math.max(2, Math.round(2 * r));
  const barW = Math.max(2, (W - gap * (n + 1)) / n);
  const color = DECK_COLORS[deck.number] || '#22d3ee';
  ctx.fillStyle = '#05070b';
  ctx.fillRect(0, 0, W, H);
  // Three zones, same colours as the 3-band waveform, so the analyser reads at a glance.
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = 'rgb(32,83,217)';
  ctx.fillRect(0, 0, W * 0.38, H);
  ctx.fillStyle = 'rgb(242,170,60)';
  ctx.fillRect(W * 0.38, 0, W * 0.30, H);
  ctx.fillStyle = 'rgb(244,246,251)';
  ctx.fillRect(W * 0.68, 0, W * 0.32, H);
  ctx.globalAlpha = 1;
  const floor = Math.max(2, Math.round(2 * r));
  for (let i = 0; i < n; i++) {
    const u = n === 1 ? 0 : i / (n - 1);
    const amp = levels ? Math.max(0, Math.min(1, levels[i])) : 0;
    const bh = floor + amp * (H - floor - 3 * r);
    const x = gap + i * (barW + gap);
    const y = H - bh;
    if (u < 0.38) ctx.fillStyle = 'rgb(32,83,217)';
    else if (u < 0.68) ctx.fillStyle = 'rgb(242,170,60)';
    else ctx.fillStyle = 'rgb(244,246,251)';
    ctx.fillRect(x, y, barW, bh);
    ctx.fillStyle = 'rgba(255,255,255,.72)';
    ctx.fillRect(x, y, barW, Math.max(1, Math.round(r)));
  }
  ctx.fillStyle = color;
  ctx.fillRect(0, H - Math.max(2, Math.round(2 * r)), W, Math.max(2, Math.round(2 * r)));
}

function paintPanelWaves(deck, pos, playing) {
  const card = document.getElementById('card');
  const pack = trackPack(deck);
  const ph = card.querySelector('.panel-phrases');
  const det = card.querySelector('.panel-detail');
  const spec = card.querySelector('.panel-spectrum');
  // The waveform is the thing that must stay on screen. A spectrum error
  // used to run first and skip the detail wave entirely.
  try { paintPanelDetail(det, pack, pos, deck, playing, deck.state === 'looping'); }
  catch (_) {}
  try { paintPanelPhrases(ph, pack, pos); } catch (_) {}
  try { paintVocalCanvas(card.querySelector('.panel-vocals'), pack, pos); } catch (_) {}
  try { paintNextEl(card.querySelector('[data-next]'), pos, pack && pack.meta); } catch (_) {}
  try { paintSpectrum(spec, pack, pos, deck, playing); } catch (_) {}
}

function paintWaves(decks, positions){
  const card = document.getElementById('card');
  card.querySelectorAll('canvas[data-wave]').forEach((cv, i) => {
    const d = decks[i] || decks[0];
    if (!d) return;
    paintWaveCanvas(
      cv,
      trackPack(d),
      positions[i] ?? positions[0],
      DECK_COLORS[d.number],
      d.state === 'looping',
      d
    );
  });
}

function paint(){
  const card = document.getElementById('card');
  const idle = document.getElementById('idle');
  if (!last){
    card.classList.remove('show');
    idle.classList.add('show');
    renderNextThird(null);
    return;
  }
  const dt = (performance.now() - receivedAt) / 1000;
  const decks = pickDecks(last);
  if (!decks.length || !decks.some(d => d.track_id)){
    card.classList.remove('show');
    idle.classList.add('show');
    renderNextThird(null);
    return;
  }
  idle.classList.remove('show');
  const positions = decks.map(d => {
    const pack = trackPack(d);
    const dur = overlayDuration(d, pack);
    const age = +(d.playhead_age_s || 0);
    const room = Math.max(0, 1 - Math.max(0, age));
    const step = d.playing ? Math.min(Math.max(0, dt), room) : 0;
    let pos = +(d.position_ms||0) + step * 1000 * (d.speed || (d.playing ? 1 : 0));
    pos = wrapLoopPosition(pos, d.state === 'looping', d.loop_start_ms, d.loop_end_ms);
    if (dur) pos = Math.min(pos, dur);
    return pos;
  });
  for (const d of decks) if (d.track_id) loadTrack(d);

  let html = '';
  if (layout === 'dual') html = renderDual(decks, positions);
  else if (layout === 'minimal') html = renderMinimal(decks[0], positions[0]);
  else if (layout === 'setlist') html = renderSetlist(decks[0], positions[0], last.setlist || []);
  else if (nowStyle === 'panel') html = renderNowPanel(decks[0], positions[0]);
  else html = renderNow(decks[0], positions[0]);

  const aud = last.audience_deck;
  const audSig = aud ? `:aud${aud.number}:${aud.track_id||0}:${aud.track_key||''}` : '';
  const np = last.now_playing;
  const mixSig = useMix && np ? `:mix${np.number}:${np.track_id||0}` : '';
  const setlistSig = layout === 'setlist'
    ? ':sl' + (last.setlist || []).map(e => `${e.deck}:${e.track_id}`).join(',')
    : '';
  const waveSig = decks.map(d => {
    const p = trackPack(d);
    const title = (p && p.meta && p.meta.title) ? String(p.meta.title) : '';
    return `${d.number}:${d.track_id||0}:${d.track_key||''}:${title}:${!!(p&&p.meta)}:${!!(p&&p.overview)}:${!!(p&&p.detail)}:${d.state||''}`;
  }).join('|');
  // Include whether history track packs loaded so art/titles refresh.
  let histSig = '';
  if (layout === 'setlist') {
    histSig = (last.setlist || []).slice(-SETLIST_MAX).map(e => {
      const p = trackPack({track_id: e.track_id, number: e.deck || 1, track_key: e.track_key || ''});
      return `${e.track_id}:${e.track_key||''}:${!!(p&&p.meta)}`;
    }).join(',');
  }
  const sig = waveSig + '|' + layout + audSig + mixSig + setlistSig + '|' + histSig
    + `|d${maxDecks}|ns${nowStyle}${nowPos}|zb${zoomBarsDisplay}|ph${playheadModeDisplay}|sp${showPhrasesDisplay}|voc${showVocalsDisplay ? 1 : 0}|nx${showNextCueDisplay ? 1 : 0}|viz${showSpectrum ? 1 : 0}`;
  if (layout === 'nowplaying' || layout === 'minimal' || layout === 'setlist') {
    syncNowPlayingCache(decks[0]);
  }
  card.classList.toggle('spread', spread || (layout === 'nowplaying' && nowStyle === 'panel'));
  if (card.dataset.sig !== sig){
    card.innerHTML = html;
    card.dataset.sig = sig;
  } else {
    card.querySelectorAll('.progress > i').forEach((el,i)=>{
      const d = decks[i] || decks[0];
      const pack = trackPack(d);
      el.style.width = progressPct(positions[i] ?? positions[0], overlayDuration(d, pack)) + '%';
    });
    card.querySelectorAll('[data-time]').forEach((el,i)=>{
      const d = decks[i] || decks[0];
      const pack = trackPack(d);
      const pos = positions[i] ?? positions[0];
      el.innerHTML = timeHtml(pos, overlayDuration(d, pack));
    });
    card.querySelectorAll('.bpm').forEach((el,i)=>{
      // Setlist history has no BPM readouts; only update now/dual/minimal.
      if (layout === 'setlist' && i > 0) return;
      const d = decks[Math.min(i, decks.length-1)];
      if (!d) return;
      if (layout === 'minimal')
        el.textContent = d.bpm ? d.bpm.toFixed(1) : '—';
      else
        el.innerHTML = `${d.bpm ? d.bpm.toFixed(2) : '—'}<small>BPM</small>`;
    });
  }
  if (layout === 'nowplaying' && nowStyle === 'panel') {
    paintPanelWaves(decks[0], positions[0], decks[0].playing);
  } else if (layout === 'setlist') paintWaves([decks[0]], [positions[0]]);
  else paintWaves(decks, positions);
  card.querySelectorAll('[data-vocals]').forEach((cv, i) => {
    const d = decks[i] || decks[0];
    if (!d) return;
    try { paintVocalCanvas(cv, trackPack(d), positions[i] ?? positions[0]); } catch (_) {}
  });
  card.querySelectorAll('[data-next]').forEach((el, i) => {
    const d = decks[i] || decks[0];
    if (!d) return;
    const pack = trackPack(d);
    try { paintNextEl(el, positions[i] ?? positions[0], pack && pack.meta); } catch (_) {}
  });
  card.classList.add('show');
  const pending = (last.mix && last.mix.pending) || last.pending || null;
  renderNextThird(pending);
}

function applyState(state){
  if (state && state.paint && last) {
    const byNum = new Map((state.decks || []).map(d => [d.number, d]));
    last = Object.assign({}, last, {t: state.t});
    if (state.audience_deck) {
      const aud = state.audience_deck;
      const live = (state.decks || []).find(d => d.number === aud.number);
      last.audience_deck = live ? Object.assign({}, aud, live) : aud;
    }
    last.decks = (last.decks || []).map(d => {
      const p = byNum.get(d.number);
      return p ? Object.assign({}, d, p) : d;
    });
    for (const p of (state.decks || [])) {
      if (!(last.decks || []).some(d => d.number === p.number)) {
        last.decks.push(p);
      }
    }
    receivedAt = performance.now();
    if (Array.isArray(state.spectrum) && state.spectrum.length) {
      loopbackBins = state.spectrum.map(Number);
      loopbackAt = performance.now();
    }
    if (state.display) {
      if (typeof state.display.show_phrases === 'boolean') {
        showPhrasesDisplay = state.display.show_phrases;
      }
      if (typeof state.display.show_vocals === 'boolean') {
        showVocalsDisplay = state.display.show_vocals;
      }
      if (typeof state.display.show_next_cue === 'boolean') {
        showNextCueDisplay = state.display.show_next_cue;
      }
      if (typeof state.display.show_spectrum === 'boolean') {
        showSpectrum = state.display.show_spectrum;
      }
    }
    return;
  }
  last = state;
  receivedAt = performance.now();
  if (state && Array.isArray(state.spectrum) && state.spectrum.length) {
    loopbackBins = state.spectrum.map(Number);
    loopbackAt = performance.now();
  } else if (state && state.display && state.display.spectrum_source !== 'loopback') {
    loopbackBins = null;
  }
  if (state && state.display) {
    if (typeof state.display.show_phrases === 'boolean') {
      showPhrasesDisplay = state.display.show_phrases;
    }
    if (typeof state.display.show_vocals === 'boolean') {
      showVocalsDisplay = state.display.show_vocals;
    }
    if (typeof state.display.show_next_cue === 'boolean') {
      showNextCueDisplay = state.display.show_next_cue;
    }
    if (typeof state.display.show_spectrum === 'boolean') {
      showSpectrum = state.display.show_spectrum;
    }
    const zb = +state.display.zoom_bars;
    if (ZOOM_BARS_OPTS.includes(zb)) zoomBarsDisplay = zb;
    if (state.display.playhead_position) {
      playheadModeDisplay = String(state.display.playhead_position);
    }
  }
}

function seedMockWave(n) {
  const h = new Uint8Array(n);
  const rgb = new Uint8Array(n * 3);
  const low = new Uint8Array(n);
  const mid = new Uint8Array(n);
  const high = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const kick = Math.pow(Math.max(0, Math.sin(i / 6)), 2);
    const vocal = Math.pow(Math.max(0, Math.sin(i / 4.2 + 1.2)), 2);
    const hat = Math.abs(Math.sin(i / 2.4 + 0.4));
    h[i] = Math.min(31, Math.round(8 + (Math.sin(i / 9) * 0.5 + 0.5) * 22));
    low[i] = Math.min(31, Math.round(4 + kick * 26));
    mid[i] = Math.min(31, Math.round(3 + vocal * 22));
    high[i] = Math.min(31, Math.round(2 + hat * 16));
    rgb[i * 3] = 30 + (i % 40);
    rgb[i * 3 + 1] = 160 + (i % 30);
    rgb[i * 3 + 2] = 220;
  }
  return {n, cps: 150, dur: 300000, h, rgb, low, mid, high, bandPeak: 31, end: 0};
}

function enableMockPreview() {
  const ov = seedMockWave(800);
  const det = seedMockWave(2400);
  tracks.set('id:1', {
    meta: {
      id: 1,
      title: 'Example Track',
      artist: 'Demo Artist',
      key: '8A',
      duration_ms: 300000,
      has_artwork: true,
      phrases: [{beat: 1, text: 'Intro'}, {beat: 33, text: 'Drop'}],
      cues: [{t: 14000, type: 'cue', hot: 1, text: 'Drop'}],
      vocals: [{t: 8000, end: 48000}, {t: 90000, end: 140000}],
      beats: [[0, 1], [468, 2], [937, 3], [1406, 4], [15468, 33]],
    },
    detail: det,
    overview: ov,
    track_id: 1,
  });
  applyState({
    decks: [{
      number: 1,
      track_id: 1,
      playing: true,
      bpm: 128,
      track_bpm: 128,
      position_ms: 8087,
      duration_ms: 300000,
      name: 'XDJ-AZ',
      master: true,
    }],
    display: {
      show_phrases: true, show_vocals: params.get('vocals') !== '0',
      show_next_cue: params.get('next') !== '0',
      zoom_bars: 4, playhead_position: 'left',
    },
  });
}

function connect(){
  if (params.get('mock') === '1') {
    enableMockPreview();
    return;
  }
  const es = new EventSource('/api/events');
  es.onmessage = ev => applyState(JSON.parse(ev.data));
  es.onerror = () => {
    es.close();
    setTimeout(connect, 1500);
  };
}

function loop(){
  requestAnimationFrame(loop);
  paint();
}

function installFloatingDrag() {
  if (!floatWindow || window.__floatingDragInstalled) return;
  if (typeof QWebChannel === 'undefined' || typeof qt === 'undefined') return;
  window.__floatingDragInstalled = true;
  new QWebChannel(qt.webChannelTransport, function(channel) {
    const bridge = channel.objects.floatingDrag;
    if (!bridge) return;
    const block = (el) => el && el.closest && (
      el.closest('canvas') || el.closest('a') || el.closest('button')
    );
    const onDown = (e) => {
      if (e.button !== 0 || block(e.target)) return;
      if (!e.target.closest('#card')) return;
      e.preventDefault();
      bridge.dragStart(e.screenX, e.screenY);
    };
    const onMove = (e) => {
      if (e.buttons & 1) bridge.dragMove(e.screenX, e.screenY);
    };
    const onUp = () => bridge.dragEnd();
    document.addEventListener('mousedown', onDown, true);
    document.addEventListener('mousemove', onMove, true);
    document.addEventListener('mouseup', onUp, true);
  });
}

if (floatWindow) {
  const s = document.createElement('script');
  s.src = 'qrc:///qtwebchannel/qwebchannel.js';
  s.onload = installFloatingDrag;
  document.head.appendChild(s);
}

connect();
loop();
</script>
