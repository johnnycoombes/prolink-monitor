name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Python 3.12 is the stable baseline. 3.14 is the version JC runs locally.
# PySide6 wheels currently allow 3.10 up to (not including) 3.15, and
# PyInstaller 6.16 or newer builds on 3.14. Source still runs on 3.10.
jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt libraries for offscreen tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 \
            libxrandr2 libnss3 libnspr4 libxshmfence1 libcups2
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libasound2t64
          else
            sudo apt-get install -y --no-install-recommends libasound2
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "tufup>=0.10,<0.11" packaging

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
