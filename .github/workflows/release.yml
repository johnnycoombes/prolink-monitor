name: Windows release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sign, for example v1.0.0"
        required: true
        type: string

# A pull request uploads the zip as an Actions artifact so the build can be
# checked before a tag exists. Pushing a tag vX.Y.Z also creates a GitHub
# Release. Signed update metadata is published only when the secrets exist.
# workflow_dispatch does not rebuild: it downloads the zip already attached
# to the tag and publishes metadata to the "updates" release.
concurrency:
  group: windows-release-${{ github.ref }}-${{ github.event_name }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows app
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver="$(python -c 'from prolink import __version__; print(__version__)')"
          echo "tag=$tag version=$ver"
          test "$tag" = "$ver"

      - name: Install build tools
        run: python -m pip install --upgrade pip -r packaging/requirements-build.txt

      - name: PyInstaller
        run: python -m PyInstaller packaging/prolink_listener.spec --noconfirm --clean

      - name: Check the bundle
        run: python packaging/verify_bundle.py dist/ProlinkListener

      - name: Zip
        shell: bash
        run: |
          ver="$(python -c 'from prolink import __version__; print(__version__)')"
          python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'dist', 'ProlinkListener')" \
            "ProlinkListener-${ver}-win64"
          ls -lh "ProlinkListener-${ver}-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: prolink-listener-windows
          path: ProlinkListener-*-win64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: prolink-listener-windows
          path: release-zip

      - name: Publish the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="$(python -c 'from prolink import __version__; print(__version__)')"
          tag="v${ver}"
          zip="$(echo release-zip/ProlinkListener-*-win64.zip)"
          test -f "$zip"
          cat > release-notes.md <<EOF
          Prolink Listener ${ver} for Windows.

          Download ProlinkListener-${ver}-win64.zip, extract it, and run ProlinkListener.exe.

          Settings stay in the .prolink-monitor folder in your user profile. The library cache stays in .prolink-cache.

          The updates release is signed metadata for the in-app updater. Do not install that one by hand.
          EOF
          gh release create "$tag" "$zip" \
            --title "Prolink Listener ${ver}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Sign and publish update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TUFUP_KEYS_B64: ${{ secrets.TUFUP_KEYS_B64 }}
          TUFUP_KEY_PASSWORD: ${{ secrets.TUFUP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ver="$(python -c 'from prolink import __version__; print(__version__)')"
          rm -rf release-app
          python -c "import shutil, sys; shutil.unpack_archive(sys.argv[1], 'release-app')" release-zip/ProlinkListener-*-win64.zip
          bash scripts/ci_publish_metadata.sh "$ver" release-app/ProlinkListener

  publish-existing:
    name: Sign existing release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the release zip and publish metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TUFUP_KEYS_B64: ${{ secrets.TUFUP_KEYS_B64 }}
          TUFUP_KEY_PASSWORD: ${{ secrets.TUFUP_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.0.0. Got: $tag" >&2
            exit 1
          fi
          ver="${tag#v}"
          mkdir -p release-zip
          gh release download "$tag" --dir release-zip --pattern "ProlinkListener-*-win64.zip" --clobber
          zip="$(echo release-zip/ProlinkListener-*-win64.zip)"
          test -f "$zip"
          rm -rf release-app
          python -c "import shutil, sys; shutil.unpack_archive(sys.argv[1], 'release-app')" "$zip"
          test -d release-app/ProlinkListener
          bash scripts/ci_publish_metadata.sh "$ver" release-app/ProlinkListener
